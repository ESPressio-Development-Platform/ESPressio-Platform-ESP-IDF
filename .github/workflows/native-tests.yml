name: Native Platform backend contract tests

on:
  push:
    branches: ["main", "ota_v1"]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ESPressio contracts
        run: |
          git clone --depth 1 --branch ota_v1 https://github.com/ESPressio-Development-Platform/ESPressio-System.git .deps/ESPressio-System
          git clone --depth 1 --branch ota_v1 https://github.com/ESPressio-Development-Platform/ESPressio-Platform.git .deps/ESPressio-Platform
      - name: Compile and run
        run: |
          set -euo pipefail
          for source in tests/native/*.cpp; do
            name="$(basename "${source}" .cpp)"
            g++ -std=gnu++17 -Wall -Wextra -Werror -pedantic \
              -Itests/fakes \
              -Isrc \
              -I.deps/ESPressio-Platform/src \
              -I.deps/ESPressio-System/src \
              "${source}" \
              -o "${name}"
            "./${name}"
          done
