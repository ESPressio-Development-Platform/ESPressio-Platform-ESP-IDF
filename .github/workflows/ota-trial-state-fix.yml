name: OTA Trial State Recovery Fix

on:
  push:
    branches: [ota_v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Patch ESP-IDF trial-state inspection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/ESPressio_Platform_IDFOTA.hpp')
          s = p.read_text()
          marker = '''    bool IsCurrentBootTrial() const noexcept {
              const auto* running = esp_ota_get_running_partition();
              if (running == nullptr) return false;
              esp_ota_img_states_t state{};
              if (esp_ota_get_state_partition(running, &state) != ESP_OK) return false;
              return state == ESP_OTA_IMG_PENDING_VERIFY;
          }
          '''
          replacement = marker + '''
              OTA::TrialBootStateResult InspectBootTargetTrialState(
                  OTA::BootTargetIdentifier target) const noexcept {
                  const auto* partition = OTADetail::FindApplicationTarget(target);
                  if (partition == nullptr) {
                      return {OTA::Status::Invalid, OTA::TrialBootState::Unknown, ESP_ERR_NOT_FOUND};
                  }
                  esp_ota_img_states_t state{};
                  const auto result = esp_ota_get_state_partition(partition, &state);
                  if (result == ESP_ERR_NOT_FOUND) {
                      return {OTA::Status::Success, OTA::TrialBootState::NeverAttempted, 0};
                  }
                  if (result != ESP_OK) {
                      const auto mapped = OTADetail::MapResult(result);
                      return {mapped.Code, OTA::TrialBootState::Unknown, mapped.NativeCode};
                  }
                  switch (state) {
                      case ESP_OTA_IMG_NEW:
                          return {OTA::Status::Success, OTA::TrialBootState::Armed, 0};
                      case ESP_OTA_IMG_PENDING_VERIFY:
                          return {OTA::Status::Success, OTA::TrialBootState::PendingValidation, 0};
                      case ESP_OTA_IMG_VALID:
                          return {OTA::Status::Success, OTA::TrialBootState::Accepted, 0};
                      case ESP_OTA_IMG_INVALID:
                      case ESP_OTA_IMG_ABORTED:
                          return {OTA::Status::Success, OTA::TrialBootState::Rejected, 0};
                      case ESP_OTA_IMG_UNDEFINED:
                          return {OTA::Status::Success, OTA::TrialBootState::Untracked, 0};
                  }
                  return {OTA::Status::Failed, OTA::TrialBootState::Unknown, ESP_ERR_INVALID_STATE};
              }
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)
          marker = '''static_assert(OTA::IsTrialBootProviderV<OTATrialBoot>,
                        "ESP-IDF trial boot must satisfy the portable OTA contract");
          '''
          replacement = marker + '''static_assert(OTA::HasTrialBootStateInspectionV<OTATrialBoot>,
                        "ESP-IDF trial boot must expose target trial-state inspection");
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          p = Path('tests/native/ota_test.cpp')
          s = p.read_text()
          marker = '''esp_ota_img_states_t RunningState{ESP_OTA_IMG_VALID};
          '''
          replacement = marker + '''esp_ota_img_states_t CandidateState{ESP_OTA_IMG_UNDEFINED};
          bool CandidateStatePresent{false};
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)
          old = '''esp_err_t esp_ota_get_state_partition(const esp_partition_t* partition, esp_ota_img_states_t* state) {
              if (partition == nullptr || state == nullptr || partition != Running) return ESP_ERR_INVALID_ARG;
              *state = RunningState;
              return ESP_OK;
          }
          '''
          new = '''esp_err_t esp_ota_get_state_partition(const esp_partition_t* partition, esp_ota_img_states_t* state) {
              if (partition == nullptr || state == nullptr) return ESP_ERR_INVALID_ARG;
              if (partition == Running) {
                  *state = RunningState;
                  return ESP_OK;
              }
              if (partition == Candidate) {
                  if (!CandidateStatePresent) return ESP_ERR_NOT_FOUND;
                  *state = CandidateState;
                  return ESP_OK;
              }
              return ESP_ERR_INVALID_ARG;
          }
          '''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          marker = '''    static_assert(OTA::IsTrialBootProviderV<OTATrialBoot>);
          '''
          replacement = marker + '''    static_assert(OTA::HasTrialBootStateInspectionV<OTATrialBoot>);
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)
          marker = '''    if (!trial.MarkCurrentBootInvalid() || RunningState != ESP_OTA_IMG_INVALID || MarkInvalidCalls != 1U) return 19;
              if (RestartCalls != 0U) return 20;
          '''
          replacement = '''    if (!trial.MarkCurrentBootInvalid() || RunningState != ESP_OTA_IMG_INVALID || MarkInvalidCalls != 1U) return 19;
              Running = &Partitions[1];
              CandidateStatePresent = false;
              const auto neverAttempted = trial.InspectBootTargetTrialState(OTA::BootTargetIdentifier{Candidate->address});
              if (!neverAttempted || neverAttempted.State != OTA::TrialBootState::NeverAttempted) return 20;
              CandidateStatePresent = true;
              CandidateState = ESP_OTA_IMG_NEW;
              const auto armed = trial.InspectBootTargetTrialState(OTA::BootTargetIdentifier{Candidate->address});
              if (!armed || armed.State != OTA::TrialBootState::Armed) return 21;
              CandidateState = ESP_OTA_IMG_ABORTED;
              const auto rejected = trial.InspectBootTargetTrialState(OTA::BootTargetIdentifier{Candidate->address});
              if (!rejected || rejected.State != OTA::TrialBootState::Rejected) return 22;
              if (RestartCalls != 0U) return 23;
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)
          s = s.replace('return 21;\n\n    OTAStorageLayoutInspection', 'return 24;\n\n    OTAStorageLayoutInspection', 1)
          s = s.replace('return 22;\n    if (!first.Layout', 'return 25;\n    if (!first.Layout', 1)
          s = s.replace('return 23;\n    const std::uint64_t expectedTotal', 'return 26;\n    const std::uint64_t expectedTotal', 1)
          s = s.replace('return 24;\n\n    return 0;', 'return 27;\n\n    return 0;', 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ESPressio_Platform_IDFOTA.hpp tests/native/ota_test.cpp
          git commit -m "feat: inspect ESP-IDF OTA trial target state"
          git push origin HEAD:ota_v1